name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend – check, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  frontend:
    name: Frontend – build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  integration:
    name: Integration – real MySQL + API smoke test
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: carebridge
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_pw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_pw
      DB_NAME: carebridge
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      PAYMENT_MODE: local
      SEED_INITIAL_DATA: "true"
      BOOTSTRAP_ADMIN_PASSWORD: CiAdmin_Pass_123!
      BOOTSTRAP_PATIENT_PASSWORD: CiPatient_Pass_123!
      BOOTSTRAP_DOCTOR_PASSWORD: CiDoctor_Pass_123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Create schema and demo data
        run: npm run db:setup
        working-directory: backend
      - name: Start API
        run: |
          nohup node server.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4000/ready && break; sleep 1; done
        working-directory: backend
      - name: Smoke test
        run: scripts/smoke-test.sh http://127.0.0.1:4000
        working-directory: .
        env:
          ADMIN_PASSWORD: CiAdmin_Pass_123!
          PATIENT_PASSWORD: CiPatient_Pass_123!
      - name: API log on failure
        if: failure()
        run: cat backend/api.log

  docker:
    name: Docker – build images
    runs-on: ubuntu-latest
    needs: [secrets-scan, backend, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: carebridge-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: Compose – boot stack, smoke test, backup/restore drill
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from template
        run: cp .env.docker.example .env
      - run: docker compose config -q
      - name: Start stack, load schema, check through nginx
        run: |
          docker compose up --build -d db backend frontend
          docker compose --profile setup run --rm migrate
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/ready && break; sleep 2; done
          ADMIN_PASSWORD='ChangeMe_Admin_123!' PATIENT_PASSWORD='ChangeMe_Patient_123!' scripts/smoke-test.sh http://127.0.0.1:8080
          curl -fs http://127.0.0.1:8080/ | grep -qi "<div id=\"root\""
      - name: Disaster-recovery drill (backup, wipe database, restore, compare)
        run: |
          count() {
            T=$(curl -fs -X POST http://127.0.0.1:8080/api/auth/admin-login -H 'Content-Type: application/json' \
                -d '{"email":"admin@carebridge.local","password":"ChangeMe_Admin_123!"}' | jq -r .token)
            curl -fs http://127.0.0.1:8080/api/dashboard -H "Authorization: Bearer $T" | jq -c '{doctors,appointments,patients}'
          }
          BEFORE=$(count); echo "before: $BEFORE"
          scripts/backup.sh backups
          docker compose exec -T db sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "DROP DATABASE carebridge; CREATE DATABASE carebridge CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"'
          scripts/restore.sh "$(ls -1t backups/db-*.sql.gz | head -1)" "$(ls -1t backups/uploads-*.tar.gz | head -1)"
          AFTER=$(count); echo "after:  $AFTER"
          [ "$BEFORE" = "$AFTER" ] || { echo "restore did not reproduce the data"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  terraform:
    name: Terraform – fmt, validate, IaC scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  publish:
    name: Publish images to GHCR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [integration, compose]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase owner for image names
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/carebridge-${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER }}/carebridge-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
